<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #171a21;
    --card: #1c2029;
    --card-hover: #232834;
    --text: #e6e9ef;
    --text-dim: #9aa3b2;
    --accent: #4f8cff;
    --border: #2a2f3a;
    --shadow: rgba(0,0,0,.4);
  }
  [data-theme="light"] {
    --bg: #f4f6fb;
    --bg-soft: #ffffff;
    --card: #ffffff;
    --card-hover: #f0f3fa;
    --text: #1a1d24;
    --text-dim: #6b7280;
    --accent: #2f6bff;
    --border: #e3e8f0;
    --shadow: rgba(20,30,60,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px 60px;
    transition: background .3s, color .3s;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 32px; flex-wrap: wrap;
  }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .search {
    flex: 1; min-width: 240px;
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px;
    transition: border-color .2s;
  }
  .search:focus-within { border-color: var(--accent); }
  .search input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 15px;
  }
  .search select {
    background: var(--bg-soft); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 8px; padding: 4px 8px; font-size: 13px; outline: none;
  }
  .icon-btn {
    background: var(--bg-soft); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 10px; width: 42px; height: 42px; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center; transition: .2s;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }

  .group { margin-bottom: 34px; }
  .group h2 {
    font-size: 14px; color: var(--text-dim); font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px;
    padding-left: 4px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 16px; text-decoration: none;
    color: var(--text); display: flex; align-items: center; gap: 12px;
    transition: transform .15s, background .2s, border-color .2s;
    position: relative;
  }
  .card:hover { transform: translateY(-3px); background: var(--card-hover); border-color: var(--accent); }
  .card .dot {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; color: #fff;
  }
  .card .meta { overflow: hidden; }
  .card .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .url { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--text-dim); font-size: 14px; padding: 20px 4px; }
  footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 40px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧭 我的导航</h1>
    <div class="search">
      <span>🔍</span>
      <input id="q" type="text" placeholder="搜索站点，或回车用搜索引擎…" autofocus>
      <select id="engine">
        <option value="https://www.google.com/search?q=">Google</option>
        <option value="https://www.bing.com/search?q=">Bing</option>
        <option value="https://www.baidu.com/s?wd=">百度</option>
      </select>
    </div>
    <button class="icon-btn" id="theme" title="切换主题">🌙</button>
  </header>

  <div id="nav"></div>

  <footer>© <span id="yr"></span> 我的导航 · 部署于 Cloudflare Pages · <a href="#" id="edit">编辑链接</a></footer>
</div>

<script>
// ===== 在这里编辑你的导航数据 =====
const DEFAULT_SITES = {
  "常用": [
    { name: "GitHub", url: "https://github.com", color: "#24292e", icon: "GH" },
    { name: "YouTube", url: "https://youtube.com", color: "#ff0000", icon: "YT" },
    { name: "Bilibili", url: "https://bilibili.com", color: "#00a1d6", icon: "B" },
    { name: "ChatGPT", url: "https://chat.openai.com", color: "#10a37f", icon: "AI" },
  ],
  "工作": [
    { name: "WorkBuddy", url: "https://workbuddy.cn", color: "#4f8cff", icon: "W" },
    { name: "Notion", url: "https://notion.so", color: "#000000", icon: "N" },
    { name: "飞书", url: "https://feishu.cn", color: "#3370ff", icon: "F" },
  ],
  "工具": [
    { name: "Cloudflare", url: "https://dash.cloudflare.com", color: "#f38020", icon: "C" },
    { name: "JSON 格式化", url: "https://jsonformatter.org", color: "#6c5ce7", icon: "{}" },
    { name: "TinyPNG", url: "https://tinypng.com", color: "#16a085", icon: "P" },
  ],
  "娱乐": [
    { name: "网易云音乐", url: "https://music.163.com", color: "#c20c0c", icon: "M" },
    { name: "豆瓣", url: "https://douban.com", color: "#2e963a", icon: "D" },
  ],
};
// =================================

const KEY = "my-nav-sites-v1";
let sites = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_SITES));
}
function save() { localStorage.setItem(KEY, JSON.stringify(sites)); }

function render(filter = "") {
  const root = document.getElementById("nav");
  root.innerHTML = "";
  const f = filter.trim().toLowerCase();
  let total = 0;
  for (const [cat, list] of Object.entries(sites)) {
    const filtered = list.filter(s => !f || s.name.toLowerCase().includes(f) || s.url.toLowerCase().includes(f));
    if (filtered.length === 0) continue;
    total += filtered.length;
    const grp = document.createElement("div");
    grp.className = "group";
    grp.innerHTML = `<h2>${cat}</h2>`;
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const s of filtered) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = s.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = `
        <div class="dot" style="background:${s.color || '#4f8cff'}">${s.icon || s.name[0]}</div>
        <div class="meta">
          <div class="name">${s.name}</div>
          <div class="url">${s.url.replace(/^https?:\/\//,'')}</div>
        </div>`;
      grid.appendChild(a);
    }
    grp.appendChild(grid);
    root.appendChild(grp);
  }
  if (total === 0) root.innerHTML = `<div class="empty">没有匹配的站点。</div>`;
}

// 搜索：输入时过滤；回车用搜索引擎
const q = document.getElementById("q");
q.addEventListener("input", () => render(q.value));
q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && q.value.trim()) {
    const eng = document.getElementById("engine").value;
    window.open(eng + encodeURIComponent(q.value.trim()), "_blank");
  }
});

// 主题切换
const themeBtn = document.getElementById("theme");
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "light" ? "☀️" : "🌙";
  localStorage.setItem("nav-theme", t);
}
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "light" ? "dark" : "light");
};
applyTheme(localStorage.getItem("nav-theme") || "dark");

// 简易编辑：导出/导入 JSON
document.getElementById("edit").onclick = (e) => {
  e.preventDefault();
  const txt = prompt("编辑导航数据（JSON 格式）：\n留空取消，输入 RESET 恢复默认。", JSON.stringify(sites, null, 2));
  if (txt === null) return;
  if (txt.trim().toUpperCase() === "RESET") { sites = JSON.parse(JSON.stringify(DEFAULT_SITES)); save(); render(); return; }
  try {
    const parsed = JSON.parse(txt);
    sites = parsed; save(); render();
  } catch (err) { alert("JSON 格式错误：" + err.message); }
};

document.getElementById("yr").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
